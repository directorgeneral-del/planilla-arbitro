name: Compilar APK Planilla Arbitro

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java JDK 17
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Configurar Android SDK
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      # 4. Localizar gradlew y otorgar permisos de ejecución
      - name: Otorgar permisos de ejecución a gradlew
        run: |
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: No se encontró el archivo 'gradlew' en todo el proyecto."
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"

      # 5. Compilar el archivo APK en el directorio exacto donde esté gradlew
      - name: Compilar APK de lanzamiento
        run: |
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug --stacktrace

      # 6. Subir el APK generado como Artefacto descargable
      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Planilla-Arbitro-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

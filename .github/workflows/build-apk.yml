name: Compilar APK Planilla Arbitro

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java JDK 21
      - name: Configurar Java JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: gradle

      # 3. Configurar Node.js versión 20
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # 4. Instalar dependencias de Node y sincronizar Capacitor
      - name: Instalar dependencias y sincronizar Capacitor
        run: |
          PACKAGE_PATH=$(find . -name package.json -not -path "*/node_modules/*" | head -n 1)
          PROJECT_DIR=$(dirname "$PACKAGE_PATH")
          echo "Navegando a: $PROJECT_DIR"
          cd "$PROJECT_DIR"
          
          npm install
          npx cap sync android

      # 5. Otorgar permisos de ejecución a gradlew
      - name: Otorgar permisos a gradlew
        run: |
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          if [ -z "$GRADLEW_PATH" ]; then
            echo "Error: No se encontró gradlew"
            exit 1
          fi
          chmod +x "$GRADLEW_PATH"

      # 6. Compilar el APK excluyendo las dependencias duplicadas de Kotlin
      - name: Compilar APK de lanzamiento
        run: |
          GRADLEW_PATH=$(find . -name gradlew | head -n 1)
          cd $(dirname "$GRADLEW_PATH")
          ./gradlew assembleDebug \
            -Pandroid.useAndroidX=true \
            -Pandroid.enableJetifier=true \
            -Dorg.gradle.project.kotlin.stdlib.default.dependency=false \
            --stacktrace

      # 7. Subir el APK generado como Artefacto descargable
      - name: Subir APK generado
        uses: actions/upload-artifact@v4
        with:
          name: Planilla-Arbitro-Debug-APK
          path: '**/build/outputs/apk/debug/*.apk'

name: Compilar APK Planilla Arbitro

on:
  push:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio usando la versión v4
      - name: Checkout del código
        uses: actions/checkout@v4

      # 2. Configurar Java JDK usando la versión v5 (resuelve la advertencia de depreciación)
      - name: Configurar Java JDK 17
        uses: actions/setup-java@v5
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. Configurar Android SDK de manera estable
      - name: Configurar Android SDK
        uses: android-actions/setup-android@v4

      # Aquí abajo deben ir los comandos específicos de tu proyecto para compilar...
      # Por ejemplo, si es Android nativo:
      - name: Otorgar permisos de ejecución a gradlew
        run: chmod +x gradlew
        working-directory: android # Ajusta la ruta si tu carpeta de android está en la raíz

      # Ejemplo de compilación con Gradle:
      - name: Compilar APK de lanzamiento
        run: ./gradlew assembleRelease
        working-directory: android

